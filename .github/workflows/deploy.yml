name: Deploy VBerCRM
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_IS_DEMO: 'false'
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SB_PUBLISHABLE_KEY: ${{ vars.VITE_SB_PUBLISHABLE_KEY }}
      VITE_ATTACHMENTS_BUCKET: attachments
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate production configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Missing VITE_SUPABASE_URL repository variable'; exit 1; }
          case "$VITE_SB_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo 'Set VITE_SB_PUBLISHABLE_KEY to a publishable key (never a secret key)'; exit 1 ;;
          esac
      - run: npm ci
      - name: Build production CRM
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish VBerCRM
        id: deployment
        uses: actions/deploy-pages@v4
